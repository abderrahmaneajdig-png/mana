ock;background:var(--wine);color:white;padding:14px 22px;text-decoration:none;text-align:center;border:0;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer}.btn:hover{background:#651933}.card .btn{margin-top:auto}.feature{background:#f6eaf0;border-radius:15px;padding:26px;margin:43px 0}.feature strong{font-size:21px}.feature p{color:var(--muted)}footer{margin-top:72px;border-top:1px solid #ece6e8;background:white;padding:25px 0;color:var(--muted);font-size:12px}.toplink{display:inline-block;color:var(--wine);font-weight:700;text-decoration:none;margin:25px 0}.detail{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center}.detail img{width:100%;height:430px;object-fit:contain;padding:30px;border-radius:20px;background:white;border:1px solid #eee}.detail p{line-height:1.65;color:var(--muted)}.panel{width:min(650px,100%);background:white;border:1px solid #ede5e8;border-radius:20px;margin:42px auto;padding:28px}label{display:block;font-weight:700;font-size:13px;margin:15px 0 5px}input,select,textarea{width:100%;border:1px solid #d8d1d5;padding:13px;border-radius:8px;font:inherit;outline-color:var(--wine)}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:15px}.consent{display:flex;gap:10px;align-items:flex-start;margin:16px 0}.consent input{width:auto;margin-top:2px}.consent span{font-size:12px;line-height:1.6}.alert{padding:15px;border-radius:10px;margin:16px 0}.alert.error{color:#8b2039;background:#fff1f4}.alert.success{color:#23633d;background:#e8f7ec}button:disabled{opacity:.6;cursor:wait}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid #eee;padding:11px;text-align:left;white-space:nowrap}.overflow{overflow:auto}.muted{color:var(--muted);font-size:13px}.back{color:var(--wine);text-decoration:none;font-weight:700}.hidden{display:none}@media(max-width:880px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.detail{grid-template-columns:1fr}.detail img{height:330px}}@media(max-width:550px){nav{gap:9px}nav a{font-size:11px}.logo{font-size:20px}.hero{padding:38px 0 0}.grid{gap:10px}.card img{height:155px;padding:6px}.content{padding:0 10px 12px}.content h3{font-size:14px}.price{font-size:23px}.btn{padding:12px 10px}.twocol{grid-template-columns:1fr}.panel{padding:19px}.detail img{height:260px}}
</style></head><body><div class="band">📦 Paiement à la livraison • الدفع عند الاستلام • Commande confirmée par téléphone</div><header><section><a class="logo" href="./">Novy<b>tek</b> Mar</a><nav><a href="./#materiel">Matériel</a><a href="./#rangement">Rangement</a><a href="?admin=1">Mes commandes</a></nav></section></header><main class="container" id="view"></main><footer><div class="container">© Novytek Mar 2026 · Maroc · Paiement à la livraison · <a href="?privacy=1">Confidentialité</a></div></footer><script>
const C={"url":"https://c--3faba59f-7b40-4dd8-b94b-8d188eac5de0-prod.lovable.cloud","key":"sb_publishable_iAXXVFtiU37Z5RIjApm_VQ_3ezO-S5I","products":[["pack","pack-maintenance","Pack entretien complet","باك الصيانة الكامل","399","bundle-BvXiXNm7.jpg","Chargeur batterie intelligent 12V + coffret outils 46 pièces. Livraison incluse dans le prix."],["chargeur","chargeur-batterie-12v","Chargeur batterie 12V","شاحن البطاريات الذكي","349","charger-70TOddKz.jpg","Écran LCD, réparation par impulsions, batteries 12V de 4 à 120Ah."],["kit","kit-outils-46","Coffret outils 46 pièces","طقم أدوات إصلاح 46 قطعة","149","toolkit-CCRJfpsw.jpg","Coffret orange pour entretien et petites réparations."],["armoire","armoire-portable","Armoire portable","خزانة ملابس متنقلة","249","wardrobe-EuapN7gp.jpg","Armoire portable en tissu bordeaux, trois portes, rangement pratique."],["chaussures","organisateur-chaussures","Rangement chaussures","منظّم الأحذية","199","shoes-eP1H8AvX.jpg","Meuble de rangement chaussures à quatre niveaux, structure noire et panneaux clairs."]]}; const P=C.products.map(a=>({id:a[0],slug:a[1],name:a[2],ar:a[3],price:Number(a[4]),img:'https://novytek-mar.lovable.app/assets/'+a[5],description:a[6]}));
const Q=new URLSearchParams(location.search),root=document.querySelector('#view');
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const detailLink=x=>'?product='+x.id;
function card(p){return '<article class="card"><img src="'+p.img+'" alt="'+esc(p.name)+'"><div class="content"><h3>'+esc(p.name)+'</h3><div class="sub" dir="rtl">'+esc(p.ar)+'</div><div class="price">'+p.price+' DH '+(p.id==='pack'?'<span class="small">شاملة التوصيل</span>':'')+'</div><a class="btn" href="'+detailLink(p)+'">Découvrir</a></div></article>'}
function home(){root.innerHTML='<div class="hero"><span class="eyebrow">NOVYTEK MAR · MAROC</span><h1>Les essentiels du quotidien<br>au meilleur prix.</h1><p>Équipez votre maison et votre atelier. Découvrez nos produits utiles, et payez uniquement à la livraison.</p><span class="chip">✓ Paiement à la livraison</span></div><h2 id="materiel">Matériel & entretien</h2><div class="grid">'+P.slice(0,3).map(card).join('')+'</div><h2 id="rangement">Maison & rangement</h2><div class="grid">'+P.slice(3).map(card).join('')+'</div><div class="feature"><strong>Pack entretien complet : 399 DH — livraison incluse</strong><p>Chargeur 12V + Coffret outils 46 pièces.</p><a class="btn" href="?product=pack">Découvrir le pack</a></div>'}
function product(p){root.innerHTML='<a class="toplink" href="./">← Accueil</a><section class="detail"><img src="'+p.img+'" alt="'+esc(p.name)+'"><div><span class="chip">NOVYTEK MAR</span><h1>'+esc(p.name)+'</h1><p dir="rtl">'+esc(p.ar)+'</p><p>'+esc(p.description)+'</p><div class="price">'+p.price+' DH '+(p.id==='pack'?'<span class="small">شاملة التوصيل</span>':'')+'</div><p>Livraison confirmée par téléphone. Aucun paiement en ligne.</p><a class="btn" href="?order='+p.id+'">Order Now · اطلب الآن</a></div></section>'}
function order(p){root.innerHTML='<section class="panel"><a class="back" href="'+detailLink(p)+'">← Retour</a><h1 style="font-size:29px">Commande · Paiement à la livraison</h1><p class="muted">عمّر معلوماتك، وغادي نتاصلو بيك باش نأكدو الطلب.</p><form id="order-form"><label>Produit</label><input value="'+esc(p.name)+'" disabled><div class="twocol"><div><label>Nom complet *</label><input name="customer" required minlength="2" maxlength="100" autocomplete="name"></div><div><label>Téléphone marocain *</label><input name="phone" required type="tel" placeholder="06XXXXXXXX" maxlength="20" autocomplete="tel"></div></div><div class="twocol"><div><label>Ville *</label><input name="city" required minlength="2" maxlength="80"></div><div><label>Quantité *</label><input name="qty" required type="number" min="1" max="10" value="1"></div></div><label>Adresse complète *</label><textarea name="address" rows="3" required minlength="5" maxlength="300"></textarea><label>Note (facultative)</label><textarea name="notes" maxlength="500" rows="2"></textarea><label class="consent"><input name="consent" type="checkbox" required><span>J'accepte l'utilisation de mes coordonnées pour confirmer et livrer ma commande.</span></label><p class="price" id="sum">'+p.price+' DH</p><p class="muted">'+(p.id==='pack'?'شاملة التوصيل':'Frais de livraison à confirmer')+'</p><div id="notice" role="status"></div><button class="btn" style="width:100%" id="submit" type="submit">Confirmer ma commande</button></form></section>';const f=document.querySelector('#order-form');f.qty.addEventListener('input',()=>document.querySelector('#sum').textContent=(p.price*Math.min(10,Math.max(1,+f.qty.value||1)))+' DH');f.addEventListener('submit',async e=>{e.preventDefault();const b=document.querySelector('#submit');b.disabled=true;b.textContent='Enregistrement…';let body={p_name:f.customer.value.trim(),p_phone:f.phone.value.trim(),p_city:f.city.value.trim(),p_address:f.address.value.trim(),p_product:p.slug,p_quantity:Number(f.qty.value),p_consent:f.consent.checked,p_notes:f.notes.value.trim()};try{const r=await fetch(C.url+'/rest/v1/rpc/novytek_submit_v2',{method:'POST',headers:{'apikey':C.key,'Content-Type':'application/json'},body:JSON.stringify(body)});const v=await r.json();if(!r.ok||v?.ok!==true)throw Error(v?.message||'Serveur indisponible');root.innerHTML='<div class="panel"><div class="alert success"><h1 style="font-size:30px">✅ Commande enregistrée !</h1><p>Merci, nous vous contacterons par téléphone pour confirmer votre commande.</p><p>Référence : <strong>'+esc(v.reference)+'</strong></p><p>Total : <strong>'+esc(v.total)+' DH</strong></p></div><a class="btn" href="./">Retour à la boutique</a></div>';}catch(err){document.querySelector('#notice').innerHTML='<p class="alert error">Commande NON enregistrée. Vérifiez vos coordonnées et réessayez : '+esc(err.message)+'</p>';b.disabled=false;b.textContent='Réessayer';}})}
function admin(){document.querySelector('head').insertAdjacentHTML('beforeend','<meta name="robots" content="noindex,nofollow">');root.innerHTML='<div class="panel" style="width:min(1080px,100%)"><h1 style="font-size:32px">Commandes clients · Dashboard</h1><p class="muted">🔒 Tableau privé : mot de passe administrateur obligatoire.</p><label>Mot de passe Admin</label><input type="password" id="password" placeholder="Mot de passe" autocomplete="off"><p><button class="btn" id="access">Voir les commandes</button></p><div id="status" class="muted"></div><div class="overflow" id="table"></div></div>';const b=document.querySelector('#access');b.addEventListener('click',async()=>{const password=document.querySelector('#password').value;const status=document.querySelector('#status');b.disabled=true;status.textContent='Chargement…';try{const r=await fetch(C.url+'/rest/v1/rpc/novytek_admin_orders_v2',{method:'POST',headers:{'apikey':C.key,'Content-Type':'application/json'},body:JSON.stringify({p_password:password})});if(!r.ok)throw Error('Mot de passe incorrect ou serveur indisponible');const rows=await r.json();status.textContent=rows.length+' commandes disponibles.';const cols=['order_reference','created_at','customer_name','phone','city','address','product_name_snapshot','quantity','total_mad','status'];const headings=['Référence','Date','Client','Téléphone','Ville','Adresse','Produit','Qté','Total DH','Statut'];document.querySelector('#table').innerHTML='<table><thead><tr>'+headings.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+cols.map(k=>'<td>'+esc(k==='created_at'?new Date(row[k]).toLocaleString('fr-MA'):row[k])+'</td>').join('')+'</tr>').join('')+'</tbody></table>';document.querySelector('#password').value='';}catch(e){status.innerHTML='<div class="alert error">'+esc(e.message)+'</div>'}finally{b.disabled=false}})}
function privacy(){root.innerHTML='<div class="panel"><h1 style="font-size:31px">Confidentialité</h1><p>Novytek Mar traite le nom, le téléphone et l’adresse uniquement pour traiter et livrer les commandes payées à la livraison. Les données ne sont pas affichées publiquement. Contactez la boutique pour demander la suppression de vos données.</p><a class="back" href="./">← Accueil</a></div>'}
if(Q.has('admin'))admin();else if(Q.has('privacy'))privacy();else if(Q.has('order')){const p=P.find(x=>x.id===Q.get('order'));p?order(p):home()}else if(Q.has('product')){const p=P.find(x=>x.id===Q.get('product'));p?product(p):home()}else home();
</script></body></html>
